<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pesona Florist — HyperFrames Composition</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,Helvetica,sans-serif}
    html,body{height:100%;margin:0;background:#0f172a;color:#fff}
    .stage{display:grid;place-items:center;height:100vh}
    .card{width:1280px;max-width:92vw;height:720px;background:linear-gradient(180deg,#0b1220,#12213a);border-radius:20px;box-shadow:0 20px 50px rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;flex-direction:column}
    .title{font-size:56px;font-weight:700;letter-spacing:0.02em;margin:0}
    .subtitle{opacity:.9;margin-top:8px;font-size:20px}
    .brand{position:absolute;left:20px;bottom:20px;opacity:.6;font-size:14px}
  </style>
</head>
<body>
  <div class="stage" data-composition-id="portfolio-composition" data-width="1280" data-height="720" data-start="0">
    <div class="card" data-hf-duration="8" data-hf-fps="30" data-composition-id="portfolio-composition" data-width="1280" data-height="720">
      <h1 class="title" data-hf="t:0-1; y:20->0; o:0->1; ease:quadInOut">Pesona Florist</h1>
      <div class="subtitle" data-hf="t:0.2-1.2; y:30->0; o:0->0.9; ease:quadInOut">High-end floral design &amp; branding</div>

      <!-- Slideshow (cycles product images from public/assets) -->
      <div id="hf-slideshow" style="margin-top:22px;position:relative;width:920px;max-width:86%;height:360px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(2,6,23,.6);">
        <img id="hf-slide" src="/assets/catalog-home-rp150000-item-01.png" alt="slide" style="width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease-in-out;"/>
        <div id="hf-slide-caption" style="position:absolute;left:18px;bottom:18px;background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);padding:8px 12px;border-radius:8px;font-size:14px;">Pesona Florist</div>
      </div>

      <div class="brand">Composition: public/hyperframes/portfolio-composition</div>
    </div>
  </div>

  <!-- Animated petals layer (decorative) -->
  <div id="hf-petals" aria-hidden="true" style="pointer-events:none;position:fixed;inset:0;z-index:10;overflow:hidden"></div>

  <style>
    /* petals */
    .hf-petal{position:absolute;width:28px;height:20px;background:linear-gradient(120deg,#ff94c9,#ffd7e8);border-radius:60% 40% 60% 40%;transform-origin:center;opacity:0.95;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
    @keyframes hfFloatUp{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-120vh) rotate(360deg);opacity:0}}

    /* slideshow caption safe area for rendering */
    @media (max-width:920px){#hf-slideshow{height:260px}}
  </style>

  <script>
    // Composition and deterministic runtime setup
    (function(){
      const compositionId = 'portfolio-composition';
      const compWidth = 1280, compHeight = 720;
      window.__timelines = window.__timelines || {};

      // cyrb53 hash -> mulberry32 seed helper (deterministic seed from composition id)
      function cyrb53(str, seed = 0) {
        let h1 = 0xDEADBEEF ^ seed, h2 = 0x41C6CE57 ^ seed;
        for (let i = 0; i < str.length; i++) {
          h1 = Math.imul(h1 ^ str.charCodeAt(i), 2654435761);
          h2 = Math.imul(h2 ^ str.charCodeAt(i), 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (h2 >>> 0) + 4294967296 * (h1 >>> 0);
      }

      function mulberry32(a) {
        return function() {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const seed = cyrb53(compositionId) >>> 0;
      const rng = mulberry32(seed);

      // register a minimal timeline descriptor for the CLI
      window.__timelines[compositionId] = { duration: 8, fps: 30, width: compWidth, height: compHeight, seed };

      // Image list from public/assets — curated for slideshow
      const hfImages = [
        "/assets/catalog-home-rp150000-item-01.png",
        "/assets/catalog-home-rp150000-item-02.jpg",
        "/assets/catalog-home-rp150000-item-03.png",
        "/assets/catalog-home-rp150000-item-04.png",
        "/assets/catalog-home-rp150000-item-05.jpg",
        "/assets/catalog-home-rp150000-item-06.jpg",
        "/assets/catalog-home-rp150000-item-07.jpg",
        "/assets/catalog-home-rp150000-item-08.jpg",
        "/assets/catalog-home-rp150000-item-09.jpg",
        "/assets/catalog-home-rp150000-item-10.jpg"
      ];

      // Slideshow logic (deterministic behavior: order and timing are stable)
      (function(){
        const imgEl = document.getElementById('hf-slide');
        const caption = document.getElementById('hf-slide-caption');
        let idx = 0;
        const preload = [];
        hfImages.forEach(src=>{const i=new Image();i.src=src;preload.push(i)});

        function show(index){
          const src = hfImages[index % hfImages.length];
          imgEl.style.opacity = 0;
          setTimeout(()=>{ imgEl.src = src; imgEl.style.opacity = 1; caption.textContent = src.split('/').pop(); }, 250);
        }

        show(idx);
        setInterval(()=>{ idx++; show(idx); }, 3500);
      })();

      // Petal emitter (deterministic: uses seeded rng instead of Math.random)
      (function(){
        const container = document.getElementById('hf-petals');
        function randRange(min, max){ return min + (rng() * (max - min)); }
        function emitPetal(){
          const p = document.createElement('div');
          p.className = 'hf-petal';
          const size = Math.round(randRange(18, 46));
          p.style.width = size + 'px';
          p.style.height = Math.round(size*0.72) + 'px';
          p.style.left = (randRange(-5, 105)) + '%';
          p.style.top = (randRange(100, 120)) + '%';
          p.style.transform = 'rotate(' + Math.round(randRange(0,360)) + 'deg)';
          const dur = Math.round(randRange(8,16));
          p.style.animation = `hfFloatUp ${dur}s linear forwards`;
          p.style.opacity = 0.95;
          container.appendChild(p);
          setTimeout(()=>p.remove(), (dur*1000)+200);
        }
        // emit petals in deterministic bursts
        setInterval(()=>{ for(let i=0;i<3;i++) emitPetal(); }, 900);
      })();

    })();
  </script>

  <!--
    This composition now includes:
      - a simple image slideshow pulling images from `public/assets`
      - a decorative petals emitter
    Preview with `npm run hf:preview` and render with `npm run hf:render`.
  -->
</body>
</html>
